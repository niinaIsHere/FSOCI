name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - run: npm test
      - run: npm run build

  tag_release:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Bump version and push tag
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !contains(join(github.event.commits.*.message, ' '), '#skip')
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch

  discord_success:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    steps:
      - uses: sarisia/actions-status-discord@v1
        if: success() && github.event_name == 'push'

        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: ${{ needs.build_and_test.result }}
          description: >
            Commit: ${{ github.sha }}, 
            Message: ${{ github.event.head_commit.message || github.event.pull_request.title }}
            Author: ${{ github.event.head_commit.author.name || github.event.pull_request.user.login }}

  discord_failure:
    needs: [build_and_test]
    runs-on: ubuntu-latest
    steps:
      - uses: sarisia/actions-status-discord@v1
        if: failure()

        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: ${{ needs.build_and_test.result }}
          description: >
            Repository: ${{ github.repository }} 
            Branch: ${{ github.ref_name }} 
            Commit: ${{ github.sha }}, 
            Message: ${{ github.event.head_commit.message || github.event.pull_request.title }}
            Author: ${{ github.event.head_commit.author.name || github.event.pull_request.user.login }}
            Workflow: ${{ github.workflow }} 
            Job: ${{ github.job }}
